<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Wiring of the worker safety monitor: ESP32 DevKit connected to an MPU6050, a MAX30102, an active buzzer and a vibration motor with an NPN transistor">
  <rect width="1000" height="660" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="700" fill="#191919">Wiring: ESP32 DevKit (pins in brackets: ESP32-S3 DevKitC)</text>
  <text x="24" y="60" font-size="14" fill="#5f6368">All parts run on 3.3 V. Power the board from USB (a power bank when worn). Keep the I2C wires under 30 cm.</text>

  <!-- ESP32 board -->
  <rect x="40" y="96" width="250" height="480" rx="14" fill="#1f2937"/>
  <rect x="88" y="120" width="154" height="84" rx="6" fill="#9ca3af"/>
  <text x="165" y="168" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">ESP32 DevKit</text>
  <rect x="140" y="548" width="50" height="28" rx="4" fill="#9ca3af"/>
  <text x="165" y="567" font-size="11" fill="#111827" text-anchor="middle">USB</text>
  <g font-size="13" fill="#f9fafb" text-anchor="end">
    <text x="270" y="244">3V3</text>
    <text x="270" y="284">GND</text>
    <text x="270" y="324">GPIO 21 (8)  SDA</text>
    <text x="270" y="364">GPIO 22 (9)  SCL</text>
    <text x="270" y="404">GPIO 25 (4)</text>
    <text x="270" y="444">GPIO 26 (5)</text>
  </g>
  <g fill="#f9fafb">
    <circle cx="284" cy="240" r="5"/><circle cx="284" cy="280" r="5"/><circle cx="284" cy="320" r="5"/>
    <circle cx="284" cy="360" r="5"/><circle cx="284" cy="400" r="5"/><circle cx="284" cy="440" r="5"/>
  </g>
  <rect x="62" y="470" width="60" height="30" rx="5" fill="#374151" stroke="#9ca3af"/>
  <text x="92" y="490" font-size="11" fill="#f9fafb" text-anchor="middle">BOOT</text>
  <text x="62" y="520" font-size="11.5" fill="#d1d5db">BOOT = GPIO 0 button</text>
  <text x="62" y="536" font-size="11.5" fill="#d1d5db">("I'm OK", setup)</text>
  <circle cx="230" cy="485" r="8" fill="#60a5fa"/>
  <text x="208" y="520" font-size="11.5" fill="#d1d5db">LED = GPIO 2</text>

  <!-- power rails -->
  <line x1="289" y1="240" x2="380" y2="240" stroke="#dc3c3d" stroke-width="4"/>
  <line x1="380" y1="112" x2="380" y2="600" stroke="#dc3c3d" stroke-width="4"/>
  <line x1="289" y1="280" x2="400" y2="280" stroke="#191919" stroke-width="4"/>
  <line x1="400" y1="112" x2="400" y2="620" stroke="#191919" stroke-width="4"/>
  <text x="372" y="106" font-size="12" font-weight="700" fill="#dc3c3d" text-anchor="end">3.3 V</text>
  <text x="408" y="106" font-size="12" font-weight="700" fill="#191919">GND</text>
  <!-- I2C bus -->
  <line x1="289" y1="320" x2="430" y2="320" stroke="#257de0" stroke-width="4"/>
  <line x1="430" y1="150" x2="430" y2="350" stroke="#257de0" stroke-width="4"/>
  <line x1="289" y1="360" x2="450" y2="360" stroke="#f47230" stroke-width="4"/>
  <line x1="450" y1="170" x2="450" y2="370" stroke="#f47230" stroke-width="4"/>

  <!-- MPU6050 -->
  <rect x="600" y="96" width="300" height="122" rx="10" fill="#1d4ed8"/>
  <text x="750" y="124" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">MPU6050 (GY-521)</text>
  <text x="750" y="143" font-size="12" fill="#dbeafe" text-anchor="middle">motion sensor, on the lower back</text>
  <g font-size="13" fill="#ffffff"><text x="612" y="164">VCC</text><text x="612" y="184">GND</text><text x="612" y="204">SDA</text><text x="700" y="204">SCL</text></g>
  <line x1="380" y1="160" x2="606" y2="160" stroke="#dc3c3d" stroke-width="3"/>
  <line x1="400" y1="180" x2="606" y2="180" stroke="#191919" stroke-width="3"/>
  <line x1="430" y1="150" x2="560" y2="150" stroke="#257de0" stroke-width="3"/>
  <path d="M560 150 V200 H606" fill="none" stroke="#257de0" stroke-width="3"/>
  <line x1="450" y1="170" x2="540" y2="170" stroke="#f47230" stroke-width="3"/>
  <path d="M540 170 V232 H730 V210" fill="none" stroke="#f47230" stroke-width="3"/>
  <text x="896" y="252" font-size="11.5" fill="#5f6368" text-anchor="end">mount with Y pointing down, or calibrate on the setup page</text>

  <!-- MAX30102 -->
  <rect x="600" y="262" width="300" height="122" rx="10" fill="#7c2d12"/>
  <text x="750" y="290" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">MAX30102</text>
  <text x="750" y="309" font-size="12" fill="#fde7d9" text-anchor="middle">pulse oximeter, on a fingertip or wrist</text>
  <g font-size="13" fill="#ffffff"><text x="612" y="330">VIN</text><text x="612" y="350">GND</text><text x="612" y="370">SDA</text><text x="700" y="370">SCL</text></g>
  <line x1="380" y1="326" x2="606" y2="326" stroke="#dc3c3d" stroke-width="3"/>
  <line x1="400" y1="346" x2="606" y2="346" stroke="#191919" stroke-width="3"/>
  <path d="M430 350 H520 V366 H606" fill="none" stroke="#257de0" stroke-width="3"/>
  <path d="M450 370 V392 H730 V376" fill="none" stroke="#f47230" stroke-width="3"/>

  <!-- buzzer -->
  <rect x="600" y="420" width="140" height="70" rx="10" fill="#374151"/>
  <text x="670" y="448" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Active buzzer</text>
  <text x="614" y="474" font-size="13" fill="#ffffff">+</text><text x="712" y="474" font-size="13" fill="#ffffff">−</text>
  <path d="M289 400 H500 V470 H606" fill="none" stroke="#00b894" stroke-width="3"/>
  <path d="M726 470 H760 V620 H400" fill="none" stroke="#191919" stroke-width="3"/>

  <!-- vibration motor with NPN -->
  <rect x="790" y="420" width="140" height="70" rx="10" fill="#374151"/>
  <text x="860" y="448" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">Vibration motor</text>
  <text x="804" y="474" font-size="13" fill="#ffffff">+</text><text x="902" y="474" font-size="13" fill="#ffffff">−</text>
  <path d="M380 600 H560 V520 H812 V476" fill="none" stroke="#dc3c3d" stroke-width="3"/>
  <circle cx="860" cy="560" r="26" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text x="860" y="565" font-size="12" font-weight="700" fill="#191919" text-anchor="middle">NPN</text>
  <path d="M908 476 V520 H878 V540" fill="none" stroke="#191919" stroke-width="3"/>
  <text x="914" y="512" font-size="11" fill="#191919">C</text>
  <path d="M289 440 H480 V560 H590" fill="none" stroke="#00b894" stroke-width="3"/>
  <rect x="590" y="551" width="60" height="18" rx="3" fill="#ffffff" stroke="#191919" stroke-width="2"/>
  <text x="620" y="564" font-size="11" fill="#191919" text-anchor="middle">1 kΩ</text>
  <path d="M650 560 H834" fill="none" stroke="#00b894" stroke-width="3"/>
  <text x="826" y="552" font-size="11" fill="#191919">B</text>
  <path d="M870 584 V640 H400 V620" fill="none" stroke="#191919" stroke-width="3"/>
  <text x="876" y="604" font-size="11" fill="#191919">E</text>
  <text x="940" y="404" font-size="11.5" fill="#5f6368" text-anchor="end">1N4148 diode across the motor,</text>
  <text x="940" y="416" font-size="11.5" fill="#5f6368" text-anchor="end">stripe (cathode) to +</text>

  <text x="24" y="652" font-size="12" fill="#5f6368">Most GY-521 and MAX30102 modules already have I2C pull-up resistors. Any NPN works (2N2222, BC337, S8050).</text>
</svg>
