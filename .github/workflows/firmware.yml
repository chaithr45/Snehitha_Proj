name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host parity tests (C port vs Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate reference vectors from phase1_pipeline.py (synthetic data)
        run: python firmware/test/host/gen_vectors.py --repo . --out build/host/vectors
      - name: Build and run the parity tests
        run: |
          cmake -S firmware/test/host -B build/host
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure -V
      - name: Supervisor station tests
        run: python firmware/tools/test_supervisor.py -v

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        shell: bash
        working-directory: firmware
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          idf.py set-target ${{ matrix.target }} build
          idf.py size
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            firmware/build/worker_safety.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/flash_args

  qemu:
    name: QEMU end-to-end test ${{ matrix.target }}
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32s3]
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0 > /dev/null
          python3 $IDF_PATH/tools/idf_tools.py install qemu-xtensa
      - name: Replay build, run in QEMU, check events and alerts
        shell: bash
        working-directory: firmware
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          tools/run_qemu_replay.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-logs-${{ matrix.target }}
          path: |
            firmware/build_qemu_${{ matrix.target }}/qemu.log
            firmware/build_qemu_${{ matrix.target }}/supervisor.log
            firmware/build_qemu_${{ matrix.target }}/supervisor.jsonl
          if-no-files-found: ignore

  demo:
    name: Live demo script (real-time, unattended)
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - uses: actions/checkout@v5
      - name: Run tools/demo.sh --ci (alerts acknowledged automatically)
        shell: bash
        working-directory: firmware
        run: |
          . $IDF_PATH/export.sh
          tools/demo.sh --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-logs
          path: |
            firmware/build_demo/demo.log
            firmware/build_demo/supervisor.log
          if-no-files-found: ignore
